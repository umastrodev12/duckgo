[project]
name = "duckgo"
version = "0.1.0"
description = "Um mini Claude Code pessoal, rodando com Groq"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "groq",
    "rich",
    "python-dotenv",
]

[project.scripts]
duckgo = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["duckgo", "duckgo.groq", "duckgo.plugin"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"